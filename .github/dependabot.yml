# Weekly version updates, grouped so a week is one PR per ecosystem instead of
# one per package. Security fixes come as their own PRs as soon as an alert
# opens (repository setting "Dependabot security updates"), not on this schedule.
version: 2
updates:
  # One entry covers the whole pnpm workspace: Dependabot reads
  # pnpm-workspace.yaml and updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # xterm and its addons are pinned as one matched set of betas (the set a
    # stable VS Code ships); a single addon bumped alone breaks the set, so
    # xterm is updated as a whole, by hand.
    ignore:
      - dependency-name: "@xterm/*"

  # The workflows pin actions to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
