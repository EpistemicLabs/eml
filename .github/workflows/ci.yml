name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Linux only while the repository is private (macOS runners count 10x against
    # the free Actions minutes); add macos-latest when it goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # Release benchmark, stage 1: what the agent reads must not get worse than
      # the last release's checked-in result (packages/bench/README.md).
      - run: node packages/bench/dist/cli.js check --eml .
      - run: pnpm -F @engramprotocol/cockpit-frontend build
      - run: pnpm -F eml-cockpit build

  # Native Windows (docs/proposals/windows-support.md): the same build, tests
  # and bundles. No one on the team runs Windows, so this job is how we know.
  build-test-windows:
    runs-on: windows-latest
    steps:
      # Keep LF line endings: tests compare file contents byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Every package's tests and both bundles, each even after an earlier step
      # failed: a red run shows everything that breaks, not just the first thing.
      - run: pnpm -r --no-bail test
        if: ${{ !cancelled() }}
      - run: pnpm -F @engramprotocol/cockpit-frontend build
        if: ${{ !cancelled() }}
      - run: pnpm -F eml-cockpit build
        if: ${{ !cancelled() }}

  # The built cockpit as a new user's first start meets it, on each OS: the
  # real host, a fresh home, the real Claude Code and Codex downloads, and the
  # hooks run the way each agent CLI runs them there (scripts/smoke-test.mjs).
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -F @engramprotocol/cockpit-frontend build
      - run: pnpm -F eml-cockpit build
      - run: node scripts/smoke-test.mjs
      # Windows: the one-line installer, from assets packed from this checkout,
      # with the autostart it registers (scripts/install-test.ps1).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-test.ps1
        if: ${{ runner.os == 'Windows' }}
      # Linux: install.sh from assets packed from this checkout, with the
      # systemd user unit it registers (scripts/install-test.sh). The runner
      # user gets lingering, so its user manager runs without a login session.
      - name: install test (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 1 20); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          bash scripts/install-test.sh
